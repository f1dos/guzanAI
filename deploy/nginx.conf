# Installed in /etc/nginx/conf.d/focus.conf, inside nginx's http context.
limit_req_zone $binary_remote_addr zone=focus_chat:10m rate=12r/m;
server {
    listen 80;
    listen [::]:80;
    server_name tokenapp.ru;
    client_max_body_size 12m;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Oai-Authenticated-User-Id "";
        proxy_set_header Cf-Connecting-Ip "";
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
    location = /api/chat {
        limit_req zone=focus_chat burst=12 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Oai-Authenticated-User-Id "";
        proxy_set_header Cf-Connecting-Ip "";
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
